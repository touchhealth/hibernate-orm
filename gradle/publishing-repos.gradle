apply plugin: 'maven-publish'

publishing {
	publications {
		publishedArtifacts( MavenPublication )
	}

	repositories {
		maven {
			url rootProject.ormVersion.isSnapshot
					? project['maven.snapshotsRepositoryUrl']
					: project['maven.releasesRepositoryUrl']

			def c = project['mavenRepositoryCredentials']
			credentials {
				username c.userName
				password c.password
			}
		}
	}
}

model {
	tasks.generatePomFileForPublishedArtifactsPublication {
		destination = file( "${buildDir}/generated-pom.xml" )
	}
}

task generatePomFile( dependsOn: 'generatePomFileForPublishedArtifactsPublication' )
